[package]
name = "tg-grab"
version = "0.1.1"
description = "Telegram media downloader and local collections"
license = "MIT"
repository = "https://github.com/R051/tg-grab"
authors = ["bryan"]
edition = "2024"
default-run = "tg-grab"

[lib]
name = "tg_grab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tg-grab"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "tg-grab-server"
path = "src/bin/server_main.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
axum = { version = "0.8", optional = true, features = ["ws"] }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
regex = "1"
base64 = "0.22"
log = "0.4"
chrono = "0.4"
getrandom = "0.3"

# Telegram MTProto (pinned to master API with SenderPool/SqliteSession/stream_updates)
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "fa7692e49f301f16dc671c2f305ac1a32cad1a8e" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "fa7692e49f301f16dc671c2f305ac1a32cad1a8e" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "fa7692e49f301f16dc671c2f305ac1a32cad1a8e", features = ["proxy"] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog"]
server = ["dep:axum", "dep:tower-http"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
