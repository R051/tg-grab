name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.1
      channel:
        description: Image channel
        type: choice
        options: [preview, latest]
        default: preview

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      IMAGE_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'preview' || 'latest') || inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate version and image tags
        id: image
        shell: bash
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          version=$(node -p "require('./package.json').version")
          revision=$(git rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$image"
            echo "version=$version"
            echo "revision=$revision"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:$IMAGE_CHANNEL"
            echo "$image:sha-${revision:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ steps.image.outputs.revision }}
          cache-from: type=gha,scope=tg-grab-amd64
          cache-to: type=gha,mode=max,scope=tg-grab-amd64
      - name: Verify the built image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: python3 tests/container-smoke.py "$IMAGE"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image tags
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
